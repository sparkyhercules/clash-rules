name: Generate RULE-SET for Premium Edition of Clash
on:
  workflow_dispatch:
  schedule:
    - cron: "30 22 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: |
          echo "RELEASE_NAME=Released on $(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "custom_icloud=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/icloud.txt" >> $GITHUB_ENV
          echo "custom_tld_not_cn=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/tld-!cn.txt" >> $GITHUB_ENV
          echo "custom_private=https://raw.githubusercontent.com/Loyalsoldier/domain-list-custom/release/private.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_reject=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/reject-list.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_proxy=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/proxy-list.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_direct=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/direct-list.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_gfw=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/gfw.txt" >> $GITHUB_ENV
          echo "Loyalsoldier_greatfire=https://raw.githubusercontent.com/Loyalsoldier/v2ray-rules-dat/release/greatfire.txt" >> $GITHUB_ENV
          echo "felixonmars_apple=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/apple.china.conf" >> $GITHUB_ENV
          echo "felixonmars_google=https://raw.githubusercontent.com/felixonmars/dnsmasq-china-list/master/google.china.conf" >> $GITHUB_ENV
          echo "cn_cidr=https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/cn.txt" >> $GITHUB_ENV
          echo "lan_cidr=https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/private.txt" >> $GITHUB_ENV
          echo "telegram_cidr=https://raw.githubusercontent.com/Loyalsoldier/geoip/release/text/telegram.txt" >> $GITHUB_ENV
        shell: bash

      - name: Checkout the "hidden" branch
        uses: actions/checkout@v7
        with:
          ref: hidden

      - name: Generate icloud.txt file
        run: |
          echo "payload:" > icloud.txt
          curl -sSL ${custom_icloud} | grep -E "^(full|domain):" | awk -F ':' '{printf "  - |+.%s|\n", $2}' | sed "s/|/'/g" >> icloud.txt

      - name: Generate google.txt file
        run: |
          echo "payload:" > google.txt
          curl -sSL ${felixonmars_google} | perl -ne '/^server=\/([^\/]+)\// && print "  - |+.$1|\n"' | sed "s/|/'/g" >> google.txt

      - name: Generate apple.txt file
        run: |
          echo "payload:" > apple.txt
          curl -sSL ${felixonmars_apple} | perl -ne '/^server=\/([^\/]+)\// && print "  - |+.$1|\n"' | sed "s/|/'/g" >> apple.txt

      - name: Generate private.txt file
        run: |
          echo "payload:" > private.txt
          curl -sSL ${custom_private} | awk -F ':' '/^full:/ {printf "  - |%s|\n", $2}' | sed "s/|/'/g" >> private.txt
          curl -sSL ${custom_private} | awk -F ':' '/^domain:/ {printf "  - |+.%s|\n", $2}' | sed "s/|/'/g" >> private.txt

      - name: Generate direct.txt file
        run: |
          echo "payload:" > direct.txt
          curl -sSL ${Loyalsoldier_direct} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(full:)([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |$2|\n"' | sed "s/|/'/g" >> direct.txt
          curl -sSL ${Loyalsoldier_direct} | grep -Ev "^(regexp|keyword|full):" | perl -ne '/^(domain:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |+.$2|\n"' | sed "s/|/'/g" >> direct.txt

      - name: Generate proxy.txt file
        run: |
          echo "payload:" > proxy.txt
          curl -sSL ${Loyalsoldier_proxy} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(full:)([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |$2|\n"' | sed "s/|/'/g" >> proxy.txt
          curl -sSL ${Loyalsoldier_proxy} | grep -Ev "^(regexp|keyword|full):" | perl -ne '/^(domain:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |+.$2|\n"' | sed "s/|/'/g" >> proxy.txt

      - name: Generate reject.txt file
        run: |
          echo "payload:" > reject.txt
          curl -sSL ${Loyalsoldier_reject} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |+.$2|\n"' | sed "s/|/'/g" >> reject.txt

      - name: Generate gfw.txt file
        run: |
          echo "payload:" > gfw.txt
          curl -sSL ${Loyalsoldier_gfw} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |+.$2|\n"' | sed "s/|/'/g" >> gfw.txt

      - name: Generate greatfire.txt file
        run: |
          echo "payload:" > greatfire.txt
          curl -sSL ${Loyalsoldier_greatfire} | grep -Ev "^(regexp|keyword):" | perl -ne '/^(domain:|full:)?([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |+.$2|\n"' | sed "s/|/'/g" >> greatfire.txt

      - name: Generate tld-not-cn.txt file
        run: |
          echo "payload:" > tld-not-cn.txt
          curl -sSL "${custom_tld_not_cn}" | perl -ne '/^domain:([-_a-zA-Z0-9]+(\.[-_a-zA-Z0-9]+)*)/ && print "  - |+.$1|\n"' | sed "s/|/'/g" >> tld-not-cn.txt

      - name: Generate cncidr.txt file
        run: |
          echo "payload:" > cncidr.txt
          curl -sSL ${cn_cidr} | perl -ne '/(.+\/\d+)/ && print "  - |$1|\n"' | sed "s/|/'/g" >> cncidr.txt

      - name: Generate telegramcidr.txt file
        run: |
          echo "payload:" > telegramcidr.txt
          curl -sSL ${telegram_cidr} | perl -ne '/(.+\/\d+)/ && print "  - |$1|\n"' | sed "s/|/'/g" >> telegramcidr.txt

      - name: Generate lancidr.txt file
        run: |
          echo "payload:" > lancidr.txt
          curl -sSL ${lan_cidr} | perl -ne '/(.+\/\d+)/ && print "  - |$1|\n"' | sed "s/|/'/g" >> lancidr.txt

      - name: Download latest mihomo and compile MRS rulesets
        shell: bash
        run: |
          set -euo pipefail
          asset_url="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | jq -r '.assets[] | select(.name | test("^mihomo-linux-amd64-v[0-9]+\\.[0-9]+\\.[0-9]+\\.gz$")) | .browser_download_url' \
            | head -n 1)"
          test -n "${asset_url}"
          curl -fsSL "${asset_url}" -o mihomo.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo

          for rule in reject apple direct gfw google icloud private proxy tld-not-cn; do
            ./mihomo convert-ruleset domain yaml "${rule}.txt" "${rule}.mrs"
          done
          for rule in cncidr lancidr telegramcidr; do
            ./mihomo convert-ruleset ipcidr yaml "${rule}.txt" "${rule}.mrs"
          done

          for rule in reject apple direct gfw google icloud private proxy tld-not-cn cncidr lancidr telegramcidr; do
            test -s "${rule}.mrs"
          done
          test -s applications.txt

      - name: Download latest sing-box CLI
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest)"
          release_tag="$(jq -er '.tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' <<<"${release_json}")"
          version="${release_tag#v}"
          asset_name="sing-box-${version}-linux-amd64.tar.gz"
          asset_url="$(jq -er --arg name "${asset_name}" '.assets[] | select(.name == $name) | .browser_download_url' <<<"${release_json}")"
          minor="$(sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/' <<<"${version}")"
          case "${minor}" in
            1.14) source_version=5 ;;
            *) echo "Unsupported sing-box source rule-set version for ${version}" >&2; exit 1 ;;
          esac
          mkdir -p .tools/sing-box
          curl -fsSL "${asset_url}" -o .tools/sing-box.tar.gz
          tar -xzf .tools/sing-box.tar.gz -C .tools/sing-box
          sing_box_bin="$(find .tools/sing-box -type f -name sing-box -print -quit)"
          test -n "${sing_box_bin}"
          chmod +x "${sing_box_bin}"
          test "$("${sing_box_bin}" version | sed -n '1s/^sing-box version //p')" = "${version}"
          {
            echo "SING_BOX_BIN=${GITHUB_WORKSPACE}/${sing_box_bin#./}"
            echo "SING_BOX_RULE_SET_VERSION=${source_version}"
            echo "SING_BOX_VERSION=${version}"
          } >> "${GITHUB_ENV}"

      - name: Generate Shadowrocket rule lists
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          import os
          import re
          import sys
          from pathlib import Path

          domain_rules = (
              "reject", "apple", "direct", "gfw", "google", "icloud",
              "private", "proxy", "tld-not-cn", "greatfire",
          )
          cidr_rules = ("cncidr", "lancidr", "telegramcidr")
          sing_box_rule_set_version = int(os.environ["SING_BOX_RULE_SET_VERSION"])
          yaml_rule = re.compile(r"^  - '([^'\r\n]+)'$")
          domain_label = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?$")
          output_rule = re.compile(r"^(?:DOMAIN(?:-SUFFIX)?,|IP-CIDR6?,)[^,\s]+$")

          def fail(path, line_number, message):
              location = f"{path}:{line_number}" if line_number is not None else str(path)
              raise ValueError(f"{location}: {message}")

          def read_payload(path):
              if not path.is_file() or path.stat().st_size == 0:
                  fail(path, None, "input file is missing or empty")
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "payload:":
                  fail(path, 1, "expected payload: as the first line")
              rules = []
              for line_number, line in enumerate(lines[1:], start=2):
                  if not line.strip():
                      continue
                  match = yaml_rule.fullmatch(line)
                  if not match:
                      fail(path, line_number, "unrecognized non-empty YAML rule")
                  rules.append((line_number, match.group(1)))
              return rules

          def convert_domain(path):
              converted = []
              for line_number, value in read_payload(path):
                  kind, domain = ("DOMAIN-SUFFIX", value[2:]) if value.startswith("+.") else ("DOMAIN", value)
                  if not domain or len(domain) > 253:
                      fail(path, line_number, f"invalid domain: {value!r}")
                  try:
                      ipaddress.ip_address(domain)
                  except ValueError:
                      pass
                  else:
                      fail(path, line_number, f"IP address is not a domain rule: {value!r}")
                  if any(not domain_label.fullmatch(label) for label in domain.split(".")):
                      fail(path, line_number, f"invalid domain: {value!r}")
                  converted.append(f"{kind},{domain}")
              return converted

          def convert_cidr(path):
              converted = []
              for line_number, value in read_payload(path):
                  try:
                      network = ipaddress.ip_network(value, strict=True)
                  except ValueError as exc:
                      fail(path, line_number, f"invalid CIDR: {value!r} ({exc})")
                  converted.append(f"IP-CIDR,{value}")
              return converted

          def convert_applications(path):
              names = []
              if not path.is_file() or path.stat().st_size == 0:
                  fail(path, None, "input file is missing or empty")
              lines = path.read_text(encoding="utf-8").splitlines()
              if not lines or lines[0] != "payload:":
                  fail(path, 1, "expected payload: as the first line")
              application_rule = re.compile(r"^  - PROCESS-NAME,(.+)$")
              for line_number, line in enumerate(lines[1:], start=2):
                  if not line.strip():
                      continue
                  match = application_rule.fullmatch(line)
                  if not match:
                      fail(path, line_number, f"unsupported application rule: {line!r}")
                  name = match.group(1)
                  if not name or name != name.strip() or "," in name or any(ord(char) < 32 for char in name):
                      fail(path, line_number, f"invalid process name: {name!r}")
                  names.append(name)
              if not names:
                  fail(path, None, "applications list is empty")
              return {"version": sing_box_rule_set_version, "rules": [{"process_name": names}]}

          def validate_output(path, lines, cidr):
              if not lines:
                  fail(path, None, "generated list is empty")
              for line_number, line in enumerate(lines, start=1):
                  if not line or line != line.strip() or not output_rule.fullmatch(line):
                      fail(path, line_number, "invalid Shadowrocket rule line")
                  if cidr and not line.startswith("IP-CIDR,"):
                      fail(path, line_number, "CIDR list must contain only IP-CIDR rules")
                  if cidr:
                      try:
                          ipaddress.ip_network(line.split(",", 1)[1], strict=True)
                      except ValueError as exc:
                          fail(path, line_number, f"invalid CIDR output: {line!r} ({exc})")
                  if not cidr and not line.startswith(("DOMAIN,", "DOMAIN-SUFFIX,")):
                      fail(path, line_number, "domain list must contain only DOMAIN or DOMAIN-SUFFIX rules")

          try:
              outputs = {}
              sing_box_sources = {}
              for name in domain_rules:
                  output = Path(f"{name}.list")
                  lines = convert_domain(Path(f"{name}.txt"))
                  validate_output(output, lines, cidr=False)
                  outputs[output] = lines
                  domain = [line.split(",", 1)[1] for line in lines if line.startswith("DOMAIN,")]
                  suffix = [line.split(",", 1)[1] for line in lines if line.startswith("DOMAIN-SUFFIX,")]
                  rules = []
                  if suffix:
                      rules.append({"domain_suffix": suffix})
                  if domain:
                      rules.append({"domain": domain})
                  sing_box_sources[f"{name}.json"] = {"version": sing_box_rule_set_version, "rules": rules}
              for name in cidr_rules:
                  output = Path(f"{name}.list")
                  lines = convert_cidr(Path(f"{name}.txt"))
                  validate_output(output, lines, cidr=True)
                  outputs[output] = lines
                  sing_box_sources[f"{name}.json"] = {
                      "version": sing_box_rule_set_version,
                      "rules": [{"ip_cidr": [line.split(",", 1)[1] for line in lines]}],
                  }
              sing_box_sources["applications.json"] = convert_applications(Path("applications.txt"))

              for path, lines in outputs.items():
                  path.write_text("\n".join(lines) + "\n", encoding="utf-8")
              import json
              for name, source in sing_box_sources.items():
                  Path(name).write_text(json.dumps(source, separators=(",", ":")) + "\n", encoding="utf-8")
          except (OSError, UnicodeError, ValueError) as exc:
              print(f"Rule-set source generation failed: {exc}", file=sys.stderr)
              raise SystemExit(1)

          print(f"Generated and validated {len(outputs)} Shadowrocket lists and {len(sing_box_sources)} sing-box sources")
          PY

      - name: Compile and verify SRS rulesets
        shell: bash
        run: |
          set -euo pipefail
          expected=(reject apple applications direct gfw google icloud private proxy tld-not-cn greatfire cncidr lancidr telegramcidr)
          for rule in "${expected[@]}"; do
            source="${rule}.json"
            output="${rule}.srs"
            python3 - "${source}" "${SING_BOX_RULE_SET_VERSION}" <<'PY'
          import json, sys
          path, expected_version = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as stream:
              data = json.load(stream)
          if data.get("version") != expected_version or not data.get("rules"):
              raise SystemExit(f"invalid sing-box source rule-set: {path}")
          PY
            "${SING_BOX_BIN}" rule-set compile --output "${output}" "${source}"
            test -s "${output}"
            "${SING_BOX_BIN}" rule-set decompile "${output}" --output "${rule}.decoded.json"
            python3 - "${source}" "${rule}.decoded.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              source = json.load(stream)
          with open(sys.argv[2], encoding="utf-8") as stream:
              decoded = json.load(stream)
          canonical = lambda rules: sorted(
              (kind, value)
              for rule in rules
              for kind, values in rule.items()
              for value in values
          )
          if canonical(source.get("rules", [])) != canonical(decoded.get("rules", [])):
              raise SystemExit(f"compiled sing-box rule-set lost or changed rules: {sys.argv[1]}")
          PY
          done

          test "$(find . -maxdepth 1 -name '*.srs' | wc -l)" -eq "${#expected[@]}"
          printf 'Generated and decompiled %s sing-box rule-sets with sing-box %s\n' "${#expected[@]}" "${SING_BOX_VERSION}"

      - name: Move files to publish directory
        run: |
          set -euo pipefail
          mkdir -p publish
          cp *.txt ./publish/
          cp *.mrs ./publish/
          cp *.list ./publish/
          cp *.srs ./publish/

      - name: Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            ./publish/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Git push assets to "release" branch
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f origin release

      - name: Purge jsdelivr CDN
        run: |
          cd publish || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done
